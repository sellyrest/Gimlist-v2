services:
  app:
    image: group-4/gimlist:week6
    build: .
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gimlist
    volumes:
      - ./gimlist.sql:/docker-entrypoint-initdb.d/gimlist.sql
    ports:
      - "3306:3306"